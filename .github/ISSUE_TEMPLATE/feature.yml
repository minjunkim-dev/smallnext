name: 기능 제안
description: 사용자의 문제와 완료 조건을 기록합니다.
title: "[Feature] "
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: 사용자 상황과 문제
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 필요한 동작
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건과 확인 방법
    validations:
      required: true
  - type: textarea
    id: flag
    attributes:
      label: 첫 병합 범위와 피처 플래그
      description: 작은 첫 변경, 플래그 기본값 OFF, 담당자, 제거 기한을 적습니다. 해당 없으면 이유를 적습니다.
  - type: textarea
    id: dependencies
    attributes:
      label: 선행 결정과 제외 범위
      description: 선행 Issue와 이번 변경에서 구현하지 않는 항목을 적습니다.
