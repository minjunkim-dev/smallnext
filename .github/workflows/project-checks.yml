name: Project checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use-cache:
        description: Restore and save CI caches
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.scope.outputs.api }}
      container: ${{ steps.scope.outputs.container }}
      ios: ${{ steps.scope.outputs.ios }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] &&
             [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             git show "$BASE_SHA:scripts/ci_scope.py" > "$RUNNER_TEMP/trusted-ci-scope.py"; then
            python3 "$RUNNER_TEMP/trusted-ci-scope.py"
          else
            for project in api container ios android; do
              echo "$project=true" >> "$GITHUB_OUTPUT"
            done
          fi

  api:
    needs: scope
    if: needs.scope.outputs.api == 'true'
    uses: ./.github/workflows/api-checks.yml
    with:
      use-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use-cache }}

  container:
    needs: scope
    if: needs.scope.outputs.container == 'true'
    uses: ./.github/workflows/api-container.yml
    with:
      use-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use-cache }}

  ios:
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    uses: ./.github/workflows/ios-checks.yml
    with:
      use-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use-cache }}

  android:
    needs: scope
    if: needs.scope.outputs.android == 'true'
    uses: ./.github/workflows/android-checks.yml
    with:
      use-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use-cache }}

  project-checks:
    name: Project checks
    if: always()
    needs: [scope, api, container, ios, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check selected job results
        id: check-selected-jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          gate_ref="$BASE_SHA"
          if ! git cat-file -e "$gate_ref:scripts/ci_gate.py"; then
            if [ "$EVENT_NAME" = pull_request ]; then
              # First PR uses this reviewed, immutable ancestor commit.
              gate_ref=547fdc9bf908ed36d155259a83052102d7c139c3
            else
              # First main push uses the reviewed squash commit, after branch deletion.
              gate_ref="$CURRENT_SHA"
            fi
          fi
          git show "$gate_ref:scripts/ci_gate.py" > "$RUNNER_TEMP/trusted-ci-gate.py"
          python3 "$RUNNER_TEMP/trusted-ci-gate.py"
