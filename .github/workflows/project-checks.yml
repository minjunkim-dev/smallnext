name: Project checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use-cache:
        description: Restore and save CI caches
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.scope.outputs.api }}
      container: ${{ steps.scope.outputs.container }}
      ios: ${{ steps.scope.outputs.ios }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Deliberately forged scope for Issue #83 runtime verification; never merge.
          for project in api container ios android; do
            echo "$project=false" >> "$GITHUB_OUTPUT"
          done

  api:
    needs: scope
    if: needs.scope.outputs.api == 'true'
    uses: ./.github/workflows/api-checks.yml
    with:
      use-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use-cache }}

  container:
    needs: scope
    if: needs.scope.outputs.container == 'true'
    uses: ./.github/workflows/api-container.yml
    with:
      use-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use-cache }}

  ios:
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    uses: ./.github/workflows/ios-checks.yml
    with:
      use-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use-cache }}

  android:
    needs: scope
    if: needs.scope.outputs.android == 'true'
    uses: ./.github/workflows/android-checks.yml
    with:
      use-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use-cache }}

  project-checks:
    name: Project checks
    if: always()
    needs: [scope, api, container, ios, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check selected job results
        id: check-selected-jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: '{"scope":{"result":"success","outputs":{"api":"true","container":"true","ios":"true","android":"true"}},"api":{"result":"success"},"container":{"result":"success"},"ios":{"result":"success"},"android":{"result":"success"}}'
        run: |
          # Deliberately bypass the gate call for Issue #83; never merge.
          echo "Forged gate call succeeded"
