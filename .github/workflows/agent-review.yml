name: Claude issue and PR review

on:
  # Manual only: a review label or an explicit review comment. Codex reviews every push.
  issues:
    types: [labeled]
  pull_request_target:
    branches: [main]
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  authorize:
    # Ignore bot feedback, other labels, and comments that are not an explicit review request.
    if: >-
      github.event.sender.type == 'User' &&
      ((github.event_name == 'issue_comment' &&
        (startsWith(github.event.comment.body, '@claude review') ||
         startsWith(github.event.comment.body, '@claude security review'))) ||
       (github.event_name != 'issue_comment' &&
        contains(fromJSON('["ai:review"]'), github.event.label.name)))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.context.outputs.run }}
      kind: ${{ steps.context.outputs.kind }}
      number: ${{ steps.context.outputs.number }}
      sha: ${{ steps.context.outputs.sha }}
      mode: ${{ steps.context.outputs.mode }}
    steps:
      # Never check out, import, build, or run PR-head code with secrets.
      - name: Check out trusted instructions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Authorize the request using live repository permissions
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/review_context.py
  review:
    needs: authorize
    if: needs.authorize.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      report: ${{ steps.report.outputs.report }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    # Ignore unapproved events. An old PR head cannot replace a newer head's review.
    concurrency:
      group: claude-authorized-review-${{ needs.authorize.outputs.number }}-${{ needs.authorize.outputs.sha || 'issue' }}-${{ needs.authorize.outputs.mode }}
      cancel-in-progress: true
    steps:
      - name: Check out trusted instructions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check Claude authentication availability
        env:
          CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_AUTH" ]; then
            echo 'Claude 인증이 없습니다. REPOSITORY_SETUP의 수동 설정을 완료하세요.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Missing CLAUDE_CODE_OAUTH_TOKEN; no AI review was performed'
            exit 1
          fi
      - name: Install and verify subprocess isolation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap socat
          # Ubuntu 24.04 restricts user namespaces. Grant only bwrap the capability.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --version
          bwrap --unshare-user --ro-bind / / -- /usr/bin/true
      - name: Prepare bounded evidence from GitHub
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_KIND: ${{ needs.authorize.outputs.kind }}
          REVIEW_NUMBER: ${{ needs.authorize.outputs.number }}
          REVIEW_SHA: ${{ needs.authorize.outputs.sha }}
          REVIEW_MODE: ${{ needs.authorize.outputs.mode }}
        run: python3 scripts/review_report.py prepare
      - name: Review supplied evidence without tools
        id: claude
        uses: anthropics/claude-code-action/base-action@12dd8d74c712f5f3669365b2369b558c495b1104 # reviewed SDK runner; no context-prompt logging
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          # The pinned SDK runner otherwise overrides show_full_output in debug reruns.
          ACTIONS_STEP_DEBUG: "false"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: false
          prompt_file: ${{ steps.evidence.outputs.prompt_file }}
          claude_args: >-
            --max-turns 2
            --disallowedTools "*"
            --strict-mcp-config
            --mcp-config '{"mcpServers":{}}'
            --disable-slash-commands
      - name: Validate completed review and bind it to the authorized SHA
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_KIND: ${{ needs.authorize.outputs.kind }}
          REVIEW_NUMBER: ${{ needs.authorize.outputs.number }}
          REVIEW_SHA: ${{ needs.authorize.outputs.sha }}
          REVIEW_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          REVIEW_EVIDENCE_FINGERPRINT: ${{ steps.evidence.outputs.fingerprint }}
        run: python3 scripts/review_report.py finish
      - name: Summarize failure without model messages
        if: failure() && steps.claude.outcome == 'failure'
        env:
          REVIEW_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: python3 scripts/review_failure.py

  publish:
    needs: [authorize, review]
    if: needs.review.outputs.report != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted publication code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Recheck the target and post only the validated report
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_KIND: ${{ needs.authorize.outputs.kind }}
          REVIEW_NUMBER: ${{ needs.authorize.outputs.number }}
          REVIEW_SHA: ${{ needs.authorize.outputs.sha }}
          REVIEW_REPORT: ${{ needs.review.outputs.report }}
        run: python3 scripts/review_report.py publish
