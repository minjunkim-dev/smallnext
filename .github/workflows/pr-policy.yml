# Copy to .github/workflows/pr-policy.yml. The project owns this copy so Dependabot can update the pin.
# pull_request selects this file from the pull request. The job runs the script and reads
# workflow-policy.json from the base commit when that commit has the script, so a later pull request
# cannot replace them. The head copy runs only when the base commit has no script yet.
# branches is main, so this copy does not run for another base. pull_request uses the workflow
# file from the pull request, so that pull request can delete this filter. PR conventions is not
# the gate. Review status, once it is required, blocks a workflow change.
# --root is the pull request tree. AGENTS.md, CLAUDE.md, and feature flags are read there and not executed.
# pull_request_target is not used: the public repository allows that event only for review-status.yml.
# ready_for_review reruns the job when a draft becomes ready, even if the body was not edited.
# The body is read from the event JSON and parsed. It is not executed.
name: PR policy

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy-base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy-head
          persist-credentials: false
      - name: Check PR title, branch, and body
        run: |
          if [ -f policy-base/scripts/workflow_policy.py ]; then
            checker=policy-base/scripts/workflow_policy.py
          else
            checker=policy-head/scripts/workflow_policy.py
          fi
          python3 "$checker" --pr --root policy-head
