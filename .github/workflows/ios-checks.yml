name: iOS checks

on:
  workflow_call:
    inputs:
      use-cache:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Identify Xcode and simulator SDK
        id: toolchain
        run: |
          python3 scripts/environment.py github
          developer_dir=$(python3 -c 'import json; print("/Applications/Xcode_" + json.load(open(".ci/toolchains.json"))["xcode"] + ".app/Contents/Developer")')
          export DEVELOPER_DIR="$developer_dir"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          python3 scripts/environment.py ios
          python3 - <<'PY'
          import hashlib, os, subprocess
          xcode = subprocess.check_output(["xcodebuild", "-version"], text=True)
          sdk = subprocess.check_output(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-build-version"], text=True)
          fingerprint = hashlib.sha256((xcode + sdk).encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"fingerprint={fingerprint}\n")
          print(xcode + sdk)
          PY
      - name: Restore pinned Swift packages
        id: packages-cache
        if: inputs.use-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/swift-packages
          key: swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('apps/ios/**/Package.resolved') }}
      - name: Restore matching iOS compiler outputs
        id: build-cache
        if: inputs.use-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ios-derived-data/Build
          key: xcode-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('apps/ios/**', '.github/workflows/ios-checks.yml') }}
      - name: Build and test iOS
        env:
          IOS_PACKAGES_DIR: ${{ runner.temp }}/swift-packages
          IOS_DERIVED_DATA: ${{ runner.temp }}/ios-derived-data
          IOS_RESULTS: ${{ runner.temp }}/ios-results.xcresult
        run: make ios-check
      - name: Preserve failing iOS test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-failure-report
          path: ${{ runner.temp }}/ios-results.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Record cache state
        if: always()
        env:
          CACHE_ENABLED: ${{ inputs.use-cache }}
          PACKAGES_HIT: ${{ steps.packages-cache.outputs.cache-hit }}
          BUILD_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: |
          printf 'iOS cache enabled: %s; packages hit: %s; exact compiler hit: %s\n' "$CACHE_ENABLED" "${PACKAGES_HIT:-false}" "${BUILD_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
