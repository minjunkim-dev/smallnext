# Copy to .github/workflows/review-status.yml (POLICY.md §9). The project owns this copy so Dependabot can update the pin.
name: Review status

# pull_request_target runs this file and the script from the default branch, so a PR cannot change the code this job runs.
# branches is main: a pull request into any other branch does not run Review status. The checker rejects a base
# ref other than the repository default branch, and an event base SHA that is not on that branch.
# Rerunning an old run keeps its BASE_SHA, so retargeting to the default branch does not make that SHA pass.
# Safe only while no step checks out or runs the PR head.
# edited re-runs this job when the body changes. ready_for_review re-runs it when a draft becomes ready,
# even if the body was not edited. The checker parses that body and does not execute it.
# issue_comment runs are not pull request checks (their SHA is the default branch). That job only re-runs the
# pull_request_target run for the current head, so the owner comment can turn Review status green without a push.
# It checks out the default branch, not the PR head, and does not read the comment body. Only an open pull
# request, and only a comment whose author is the repository owner (github.repository_owner, the same login
# the checker compares). An organization name is not a user, so a member comment does not rerun and is not an
# approval. Deleting that comment still reruns, because the payload's comment author stays the owner.
# The run is chosen by its own head_sha. pull_requests[].head.sha can change to the current head and point at an older run.
# If that run cannot be listed, the job posts a failing check named Review status on the current head.
# It does not write review/independent or review/security. review-status-policy.json allows only these two events.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  review-status:
    if: github.event_name == 'pull_request_target'
    name: Review status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Required review statuses on this head
        run: python3 scripts/check_review_status.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # actions: write re-runs this workflow's own pull_request_target run.
  # checks: write posts a failing Review status check only when that run cannot be listed.
  # Checkout is the default branch. The comment body is not read.
  comment:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.state == 'open' && github.event.comment.user.login == github.repository_owner
    concurrency:
      group: review-status-rerun-${{ github.event.issue.number }}
      cancel-in-progress: true
    name: Re-run review status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Re-run Review status for the current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6; do
            set +e
            python3 scripts/rerun_review_status.py
            code=$?
            set -e
            if [ "$code" -ne 2 ]; then
              exit "$code"
            fi
            sleep 10
          done
          echo "matching run still in progress" >&2
          exit 1
