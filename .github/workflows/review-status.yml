# Copy to .github/workflows/review-status.yml (POLICY.md §9). The project owns this copy so Dependabot can update the pin.
name: Review status

# pull_request_target runs this file and the script from the default branch, also for a PR into another branch,
# so a PR cannot change the code this job runs. Safe only while no step checks out or runs the PR head.
# issue_comment runs are not pull request checks (their SHA is the default branch). That job only re-runs the
# pull_request_target run for the current head, so the owner comment can turn Review status green without a push.
# It does not read the comment body. Only an open pull request, and only a comment whose author is the
# repository owner (github.repository_owner, the same login the checker compares). An organization
# name is not a user, so a member comment does not rerun and is not an approval. Deleting that comment still
# reruns, because the payload's comment author stays the owner. review-status-policy.json allows only these two events.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  review-status:
    if: github.event_name == 'pull_request_target'
    name: Review status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Required review statuses on this head
        run: python3 scripts/check_review_status.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # actions: write is only for re-running this workflow's own pull_request_target run. No checkout, no comment body.
  comment:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.state == 'open' && github.event.comment.user.login == github.repository_owner
    concurrency:
      group: review-status-rerun-${{ github.event.issue.number }}
      cancel-in-progress: true
    name: Re-run review status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run Review status for the current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            *[!0-9]*|"") echo "bad pull request number" >&2; exit 1 ;;
          esac
          sha=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)
          case "$sha" in
            *[!0-9a-fA-F]*|"") echo "bad head sha" >&2; exit 1 ;;
          esac
          # pull_request_target records the run on the base commit, so --commit of the PR head does not find it.
          for _ in 1 2 3 4 5 6; do
            while read -r id; do
              [ -n "$id" ] || continue
              status=$(gh api "repos/${REPO}/actions/runs/${id}" --jq "if any(.pull_requests[]?; .number == ${PR_NUMBER} and .head.sha == \"${sha}\") then .status else empty end")
              if [ -z "$status" ]; then
                continue
              fi
              if [ "$status" = "completed" ]; then
                gh run rerun "$id" --repo "$REPO"
                exit 0
              fi
              break
            done < <(gh run list --repo "$REPO" --workflow review-status.yml --event pull_request_target --limit 50 --json databaseId --jq '.[].databaseId')
            sleep 10
          done
          echo "no completed pull_request_target run for pull ${PR_NUMBER} at ${sha}" >&2
          exit 1
