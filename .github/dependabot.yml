# Owned by this repository. Starting point: repo-baseline templates/github/dependabot.yml.
version: 2
updates:
  # Workflow actions are pinned to full SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Asia/Seoul
    labels: [dependencies]
    # Wait a week before proposing a newly published version: fresh releases are where hijacked packages show up.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # CodeQL fails unless init and analyze run the same version.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: cargo
    directory: /services/api
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Asia/Seoul
    labels: [dependencies]
    # Wait a week before proposing a newly published version: fresh releases are where hijacked packages show up.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One weekly PR for minor and patch updates; each major update still gets its own PR.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Asia/Seoul
    labels: [dependencies]
    # Wait a week before proposing a newly published version: fresh releases are where hijacked packages show up.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One weekly PR for minor and patch updates; each major update still gets its own PR.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Asia/Seoul
    labels: [dependencies]
    # Wait a week before proposing a newly published version: fresh releases are where hijacked packages show up.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One weekly PR for minor and patch updates; each major update still gets its own PR.
      minor-and-patch:
        update-types: [minor, patch]
