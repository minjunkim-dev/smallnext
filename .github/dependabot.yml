# Generated by repo-baseline tools/apply_baseline.py. Edit templates/dependabot*.yml there, then re-apply.
version: 2
updates:
  # Workflow actions are pinned to full SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Asia/Seoul
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      # CodeQL fails unless init and analyze run the same version.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: cargo
    directory: /services/api
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Asia/Seoul
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Asia/Seoul
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: Asia/Seoul
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
