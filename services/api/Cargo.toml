[package]
name = "smallnext-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
default-run = "smallnext-api"
publish = false

[dependencies]
axum = "0.8"
http-body = "1"
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6", features = ["axum_extras"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
