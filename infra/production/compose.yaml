name: smallnext

services:
  api:
    image: ${SMALLNEXT_API_IMAGE:-smallnext-api:local}
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the managed PostgreSQL connection URL}
      API_BIND_ADDRESS: 0.0.0.0:8080
      API_AUTO_MIGRATE: "0"
      RUST_LOG: smallnext_api=info
      USER_SERVER_AI:
      SUPABASE_URL:
      SUPABASE_PUBLISHABLE_KEY:
      AI_ALLOWED_SUPABASE_UIDS:
      AI_MODEL_CONFIRMED:
      ANTHROPIC_API_KEY:
      AI_MODEL_CONTEXT_TOKENS:
      AI_MAX_OUTPUT_TOKENS:
      AI_INPUT_MICRO_USD_PER_MILLION:
      AI_OUTPUT_MICRO_USD_PER_MILLION:
      AI_BUDGET_MICRO_USD:
      AI_DAILY_BUDGET_MICRO_USD:
      AI_USER_DAILY_REQUESTS:
      AI_PUBLIC_ACCESS:
      AI_USAGE_HASH_KEY:
    expose:
      - "8080"
    volumes:
      - ./tls:/etc/smallnext/tls:ro
    restart: unless-stopped

  migrate:
    image: ${SMALLNEXT_API_IMAGE:-smallnext-api:local}
    profiles: [tools]
    entrypoint: [migrate-api]
    env_file:
      - path: ${MIGRATION_ENV_FILE:-.env.migration}
        required: false
    volumes:
      - ./tls:/etc/smallnext/tls:ro

  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set the API domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./captcha:/srv/smallnext-captcha:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
