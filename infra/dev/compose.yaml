name: smallnext-dev

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: smallnext
      POSTGRES_USER: smallnext
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smallnext-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smallnext -d smallnext"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
